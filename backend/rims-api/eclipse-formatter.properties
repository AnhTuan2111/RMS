# Cấu hình Eclipse formatter dùng cho Spotless (mvn spotless:apply).
#
# Chỉ khai báo những thiết lập khác mặc định của Eclipse; phần còn lại lấy theo mặc định.
# Style chốt cho repo này: Allman (dấu { xuống dòng riêng), thụt 4 dấu cách, dòng tối đa 120 ký tự,
# nhưng giữ "} else" và "} catch" trên cùng một dòng — đúng như code đang viết.
#
# IntelliJ: Settings > Editor > Code Style > Java > gear > Import Scheme > Eclipse XML Profile
# không đọc được file .properties, nên trong IDE hãy chọn Braces placement = "Next line"
# cho Class/Method/Other, hoặc chỉ cần chạy `mvn spotless:apply` trước khi commit.

# --- Thụt lề ---
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.continuation_indentation=2
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false

# --- Độ dài dòng ---
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.comment.line_length=120
org.eclipse.jdt.core.formatter.join_wrapped_lines=false
org.eclipse.jdt.core.formatter.join_lines_in_comments=false

# --- Allman: dấu { xuống dòng riêng ---
org.eclipse.jdt.core.formatter.brace_position_for_type_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_method_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_constructor_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_block=next_line
org.eclipse.jdt.core.formatter.brace_position_for_block_in_case=next_line
org.eclipse.jdt.core.formatter.brace_position_for_switch=next_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_constant=next_line
org.eclipse.jdt.core.formatter.brace_position_for_annotation_type_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_record_declaration=next_line
org.eclipse.jdt.core.formatter.brace_position_for_record_constructor=next_line
org.eclipse.jdt.core.formatter.brace_position_for_anonymous_type_declaration=next_line

# Ngoại lệ: thân lambda và array initializer giữ { ở cuối dòng.
# Allman cho lambda làm chuỗi stream bị vỡ vụn, rất khó đọc.
org.eclipse.jdt.core.formatter.brace_position_for_lambda_body=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_array_initializer=end_of_line

# --- Giữ else/catch/finally trên cùng dòng với } đóng ---
org.eclipse.jdt.core.formatter.insert_new_line_before_else_in_if_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_catch_in_try_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_finally_in_try_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_while_in_do_statement=do not insert

# --- Không đụng vào comment ---
# Comment trong repo này là tiếng Việt và nhiều dòng rất dài; để formatter ngắt lại
# sẽ làm hỏng ý và tạo diff khổng lồ không cần thiết.
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.format_header=false
org.eclipse.jdt.core.formatter.never_indent_line_comments_on_first_column=true
org.eclipse.jdt.core.formatter.never_indent_block_comments_on_first_column=true

# --- Giữ nguyên dòng trống do người viết đặt ---
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.blank_lines_before_package=0
org.eclipse.jdt.core.formatter.blank_lines_after_package=1

# --- Bắt buộc có { cho if/for/while một dòng ---
org.eclipse.jdt.core.formatter.keep_simple_if_on_one_line=false
org.eclipse.jdt.core.formatter.keep_then_statement_on_same_line=false
org.eclipse.jdt.core.formatter.keep_else_statement_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_for_body_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_while_body_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_do_while_body_on_same_line=false
